name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cifar-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install pytest
      - name: Run tests
        run: pytest
      - name: Run one-batch smoke experiment
        run: >-
          python train_cifar.py --dataset fake --model dyrelu-resnet
          --ratio 0.5 --device cpu --epochs 1 --batch-size 2
          --fake-data-size 4 --max-train-batches 1 --max-val-batches 1
